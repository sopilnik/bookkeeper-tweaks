<!-- An approved invoice in the new app (/app/!<org>/invoicing/view/<id>): the page header's actions in the order captured on the demo company on 18 October 2026 — Preview, the Print PDF group with its split trigger, Add payment and the kebab — reduced to what the extension uses. Xero's print list opens in its portal and is not part of the page -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invoice INV-0024 – Demo Company (Global) – Xero</title>
</head>
<body>
  <div id="shell-app-root">
    <div class="PageHeaderActions">
      <span class="KeyboardShortcutTooltip xui-tooltip"><button type="button" class="xui-button xui-button-standard" data-automationid="PreviewButton">Preview</button></span>
      <div class="PrintDropdown-group xui-buttongroup">
        <span class="xui-tooltip xui-has-inline-trigger"><button type="button" id="PrintDropdown-print" class="xui-button xui-button-standard" data-automationid="PrintDropdown-print">Print PDF</button></span>
        <div class="xui-dropdown--toggledwrapper"><button type="button" class="xui-button xui-button-split xui-button-standard" data-automationid="PrintDropdown-dropdown-trigger" aria-label="More print options"></button></div>
      </div>
      <span class="KeyboardShortcutTooltip xui-tooltip xui-has-inline-trigger"><button type="button" class="xui-button xui-button-standard">Add payment</button></span>
      <div class="KebabOptionsOverflowMenu xui-margin-left-small"><button type="button" class="xui-button xui-button-standard" data-automationid="kebab-options-button" aria-label="More options"></button></div>
    </div>
  </div>
</body>
</html>
