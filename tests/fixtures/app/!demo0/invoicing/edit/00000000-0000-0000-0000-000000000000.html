<!-- Xero's invoice editor, a draft (/app/!demo0/invoicing/edit/<id>): the Approve group and its tooltip, captured on the demo company on 17 October 2026 and reduced to what the extension uses -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit invoice INV-0030</title>
</head>
<body>
  <div id="shell-app-root">
    <div class="xui-margin-left-small ApproveAndEmailButton xui-buttongroup">
      <span class="KeyboardShortcutTooltip xui-tooltip xui-has-inline-trigger">
        <button id="ApproveAndEmailButton-approve-and-email" class="xui-button xui-button-main xui-button-small" data-automationid="ApproveAndEmailButton-approve-and-email" type="button" aria-describedby="xui-tooltip-approve">Approve &amp; email</button>
      </span>
      <div class="xui-dropdown--toggledwrapper">
        <button class="xui-button xui-button-split xui-button-main xui-button-small xui-button-grouped" data-automationid="ApproveAndEmailButton-dropdown-trigger" type="button" aria-label="More approve options" aria-haspopup="listbox"></button>
      </div>
    </div>
  </div>
  <div class="xui-portal">
    <div class="xui-container">
      <span id="xui-tooltip-approve" role="tooltip" class="xui-tooltip--tip xui-tooltip--tip-portal xui-tooltip--arrow-top" aria-hidden="true">Ctrl-Alt-E</span>
    </div>
  </div>
</body>
</html>
